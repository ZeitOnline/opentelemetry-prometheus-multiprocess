[project]
name = "opentelemetry-sdk-extension-prometheus-multiprocess"
authors = [{ name = "Zeit Online", email = "zon-backend@zeit.de" }]
dynamic = ["readme", "version"]
dependencies = [
    "opentelemetry-sdk >= 1.30.0.dev0",
    "opentelemetry-exporter-prometheus",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/ZeitOnline/opentelemetry-prometheus-multiprocess"
Changelog = "https://github.com/ZeitOnline/opentelemetry-prometheus-multiprocess/blob/main/CHANGES.md"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{path="README.md"}, {text="\n\n"}, {path="CHANGES.md"}]

[tool.pytest.ini_options]
addopts = "--tb=native"
filterwarnings = [
  "error",
]
